<!doctype html>
<html lang="sv" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
    <title>Kollepedia NG</title>
    <script nonce="%sveltekit.nonce%">
      // Theme before first paint (no FOUC): stored choice, else system preference.
      // The nonce lets the Content-Security-Policy in svelte.config.js allow
      // exactly this inline script and nothing else.
      (function () {
        try {
          var t = localStorage.getItem('kollepedia-theme');
          if (!t) t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          document.documentElement.dataset.theme = t;
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>

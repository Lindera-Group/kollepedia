[project]
name = "kollepedia-server"
version = "0.8.2"
description = "Kollepedia NG API — versioned, provenance-first terminology for public transport"
readme = "../README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "pydantic>=2.9",
    "httpx>=0.28.1",
    "mcp>=1.30,<2",
    "openpyxl>=3.1.5",
    "python-multipart>=0.0.32",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.13.0",
    "pycrdt>=0.14.1",
    "pycrdt-websocket>=0.16.4",
    "defusedxml>=0.7.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 99
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends(...)` in argument defaults is the idiomatic FastAPI DI pattern.
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
